name: Deploy to Hostalia

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Project
        run: npm run build

      # Sincroniza dist/ con la carpeta del dominio en Hostalia (FTP_REMOTE_DIR = /dosambients.es).
      # --delete borra en el servidor lo que ya no existe en dist/, salvo los archivos del hosting
      # excluidos: .user.ini (configuración de PHP) y .well-known/ (validación del certificado SSL).
      - name: 📂 Sync files (LFTP)
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow no; set ssl:verify-certificate no; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }}; mirror -R -v --parallel=2 --delete --exclude-glob .user.ini --exclude .well-known/ ./dist ${{ secrets.FTP_REMOTE_DIR }}; bye"
